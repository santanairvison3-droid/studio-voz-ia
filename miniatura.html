<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de Miniatura — DarkBlue</title>
</head>
<body>
<style>
  :root{
    --bg:#070a11; --panel:#0e1524; --panel-2:#131c2e; --ink:#e9f0fb; --muted:#8b99b3;
    --line:rgba(120,170,255,.14); --accent:#38bdf8; --accent-2:#6366f1; --danger:#ff5470;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  header{padding:12px 16px 0;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent)}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .logo{font-weight:800;letter-spacing:-.02em;font-size:18px;white-space:nowrap}
  .logo b{color:var(--ink)} .logo i{font-style:normal;background:linear-gradient(90deg,var(--accent),#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
  .toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
  button.btn{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  button.btn:hover{border-color:var(--accent);background:#182238}
  button.btn.pri{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:none;color:#04121f}
  button.btn.hot{background:linear-gradient(90deg,#ff3b3b,#ff7a18);border:none;color:#fff;font-weight:700}
  button.btn.tgl.on{background:var(--accent);color:#04121f;border-color:transparent}
  button.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  button.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .posctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .grp{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .grp button{font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--panel-2);border:none;padding:7px 10px;cursor:pointer;border-right:1px solid var(--line)}
  .grp button:last-child{border-right:none}.grp button.on{background:var(--accent);color:#04121f}
  main{display:flex;gap:16px;padding:16px;flex:1;min-height:0;align-items:flex-start;flex-wrap:wrap}
  .stagewrap{flex:1 1 520px;min-width:300px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .canvas-box{position:relative;width:100%;max-width:980px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0a0f1a;box-shadow:0 18px 50px rgba(0,0,0,.5);touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center;max-width:900px;line-height:1.5}
  aside{flex:0 0 312px;width:312px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:13px;align-self:stretch;max-height:calc(100vh - 118px);overflow:auto}
  .insp-title{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;line-height:1.55}
  .field{display:flex;flex-direction:column;gap:6px}
  .field>label{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
  textarea,input[type=text],select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.row .field{flex:1;min-width:120px}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:23px;height:23px;border-radius:6px;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
  .sw.active{border-color:#fff;transform:scale(1.12)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:44px;font-size:12px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;font-family:inherit;font-weight:600}
  .seg button.on{background:var(--accent);color:#04121f;border-color:transparent}
  .warn{font-size:12px;color:#ffb020;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.25);border-radius:8px;padding:7px 9px;line-height:1.4}
  .zrow{display:flex;gap:6px}.zrow button{flex:1}
  hr{border:none;border-top:1px solid var(--line);margin:2px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--accent)}
  .layers{display:flex;flex-direction:column;gap:5px;max-height:130px;overflow:auto}
  .layer{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:12.5px}
  .layer.sel{border-color:var(--accent);background:#152034}.layer .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:820px){aside{flex-basis:100%;width:100%;max-height:none}}
</style>

<div class="app">
  <header>
    <div class="top">
      <div class="logo"><b>Dark</b><i>Thumb</i></div>
      <span class="badge">Editor de miniatura · 1280×720 · qualquer nicho</span>
    </div>
    <div class="toolbar">
      <button class="btn hot" id="b-preset">⚡ Modelo Red Line</button>
      <div class="posctl">Texto:<div class="grp" id="pos"><button data-z="left">Esq</button><button data-z="center">Centro</button><button data-z="right" class="on">Dir</button></div></div>
      <span class="sep"></span>
      <button class="btn pri" id="b-img">📁 Imagem</button>
      <button class="btn" id="b-text">＋ Texto</button>
      <button class="btn" id="b-emoji">😀 Emoji</button>
      <button class="btn" id="b-brush">🟥 Linha</button>
      <button class="btn" id="b-shape">◆ Forma</button>
      <button class="btn" id="b-seal">🔖 Selo</button>
      <span class="sep"></span>
      <button class="btn tgl" id="b-scrim">🌑 Escurecer</button>
      <button class="btn tgl on" id="b-guides">📐 Guias</button>
      <button class="btn tgl" id="b-gold">🥇 Dourado</button>
      <span class="sep"></span>
      <button class="btn danger" id="b-del">🗑 Apagar</button>
      <button class="btn pri" id="b-dl">⬇ Baixar PNG</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
  </header>
  <main>
    <div class="stagewrap">
      <div class="canvas-box"><canvas id="cv" width="1280" height="720"></canvas></div>
      <div class="hint">Monte do <b>SEU</b> jeito, pra qualquer nicho. Clique num elemento pra editar · arraste pra mover · setas ajustam · Delete apaga. Muita opção = sua miniatura fica <b>única</b> (foge da cara de automação).</div>
    </div>
    <aside id="insp">
      <div class="insp-title" id="insp-head">Imagem & Fundo</div>
      <div id="insp-body"></div>
      <hr>
      <div class="insp-title">Camadas</div>
      <div class="layers" id="layers"></div>
    </aside>
  </main>
</div>

<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=1280,H=720,ZW=628,MARGIN=52;
  const IMPACT='Impact,"Haettenschweiler","Franklin Gothic Heavy","Arial Narrow","Arial Black",sans-serif';
  const FONTS=[['Impact',IMPACT],['Arial Black','"Arial Black",Gadget,sans-serif'],['Bahnschrift','Bahnschrift,"DIN Condensed",sans-serif'],['Trebuchet','"Trebuchet MS",sans-serif'],['Verdana','Verdana,Geneva,sans-serif'],['Tahoma','Tahoma,sans-serif'],['Century Gothic','"Century Gothic",AppleGothic,sans-serif'],['Georgia','Georgia,serif'],['Times','"Times New Roman",Times,serif'],['Palatino','"Palatino Linotype","Book Antiqua",serif'],['Comic','"Comic Sans MS",cursive'],['Manuscrita','"Segoe Script","Brush Script MT",cursive'],['Marcador','"Ink Free","Segoe Print",cursive'],['Mono','Consolas,"Courier New",monospace']];
  const PALETTE=['#FFFFFF','#000000','#FFD700','#CC0000','#D4AF37','#FF2E63','#FF5C00','#FF9F1C','#37FF8B','#00E5A0','#00E5FF','#38BDF8','#2E5BFF','#A855F7','#FF00E5','#FF6FB5'];
  const EMOJIS=['🔥','😱','😮','😍','💰','⚠️','✅','❌','👉','💡','❤️','⭐','💀','🤯','👀','🚀','🎯','💸','🏆','😭'];
  const SHAPES=[['Retângulo','rect'],['Elipse','ellipse'],['Círculo destaque','ring'],['Triângulo','tri'],['Seta','arrow'],['Estrela','star']];

  let bg=null, layers=[], sel=-1, drag=null, gold=false, scrim=false, guides=true, exporting=false, textZone='right';
  const img={b:1,c:1,s:1,se:0,g:0,bl:0,vig:false};

  function zoneBox(){ if(textZone==='left')return{x:MARGIN,w:ZW}; if(textZone==='center')return{x:(W-ZW)/2,w:ZW}; return{x:W-MARGIN-ZW,w:ZW}; }
  const zoneC=()=>{ const z=zoneBox(); return z.x+z.w/2; };
  function measure(text,size,font,sp){ ctx.save(); ctx.font=`800 ${size}px ${font}`; if('letterSpacing'in ctx)ctx.letterSpacing=(sp||0)+'px'; const w=ctx.measureText(text||' ').width; ctx.restore(); return w; }
  function fit(text,font,maxW,maxS,minS){ let s=maxS; while(s>minS){ if(measure(text,s,font,0)<=maxW)break; s-=2; } return s; }
  function roundRect(x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  const anchorX=(l,w)=> l.align==='center'?l.x-w/2 : l.align==='right'?l.x-w : l.x;
  const filterStr=()=>`brightness(${img.b}) contrast(${img.c}) saturate(${img.s}) sepia(${img.se}) grayscale(${img.g}) blur(${img.bl}px)`;

  function drawBg(){
    if(bg){ ctx.save(); ctx.filter=filterStr(); const ir=bg.width/bg.height,cr=W/H; let dw,dh; if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;} ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh); ctx.restore();
      if(img.vig){ const g=ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,W*0.62); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); } }
    else{ const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#0c1322'); g.addColorStop(1,'#0a1526'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.fillStyle='rgba(139,153,179,.55)'; ctx.font='600 32px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('📁  Envie sua imagem — ou ⚡ Modelo Red Line', W/2, H/2); ctx.textAlign='left'; ctx.textBaseline='alphabetic'; }
  }
  function drawScrim(){ const z=zoneBox(),dir=textZone==='left'?1:textZone==='right'?-1:0; let g;
    if(dir===0){ g=ctx.createRadialGradient(W/2,H/2,120,W/2,H/2,W/2); g.addColorStop(0,'rgba(0,0,0,.5)'); g.addColorStop(1,'rgba(0,0,0,0)'); }
    else if(dir<0){ g=ctx.createLinearGradient(z.x-120,0,W,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.62)'); }
    else{ g=ctx.createLinearGradient(0,0,z.x+z.w+120,0); g.addColorStop(0,'rgba(0,0,0,.62)'); g.addColorStop(1,'rgba(0,0,0,0)'); }
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  function drawText(l){ ctx.save(); const txt=l.upper?(l.text||'').toUpperCase():(l.text||''); ctx.font=`800 ${l.size}px ${l.font}`; if('letterSpacing'in ctx)ctx.letterSpacing=(l.spacing||0)+'px'; ctx.textBaseline='top'; ctx.textAlign=l.align||'left';
    const w=ctx.measureText(txt||' ').width; l._w=w; const ax=anchorX(l,w);
    if(l.highlight){ const p=l.size*0.14; ctx.save(); ctx.fillStyle=l.highlightColor||'#CC0000'; ctx.fillRect(ax-p,l.y-p*0.4,w+p*2,l.size*1.02+p*0.8); ctx.restore(); }
    if(l.shadow){ ctx.save(); ctx.shadowColor=l.shadowColor||'rgba(0,0,0,.85)'; ctx.shadowBlur=l.size*0.14; ctx.shadowOffsetX=l.size*0.05; ctx.shadowOffsetY=l.size*0.07; ctx.fillStyle=l.color; ctx.fillText(txt,l.x,l.y); ctx.restore(); }
    if(l.neon){ ctx.save(); ctx.shadowColor=l.color; ctx.fillStyle=l.color; ctx.shadowBlur=l.size*0.55; ctx.fillText(txt,l.x,l.y); ctx.fillText(txt,l.x,l.y); ctx.shadowBlur=l.size*0.95; ctx.fillText(txt,l.x,l.y); ctx.restore(); }
    if(l.outline>0){ ctx.lineJoin='round'; ctx.miterLimit=2; ctx.lineWidth=l.outline*2; ctx.strokeStyle=l.outlineColor||'#000'; ctx.strokeText(txt,l.x,l.y); }
    if(l.grad){ const g=ctx.createLinearGradient(0,l.y,0,l.y+l.size); g.addColorStop(0,l.color); g.addColorStop(1,l.color2||'#ffffff'); ctx.fillStyle=g; } else ctx.fillStyle=l.color;
    ctx.fillText(txt,l.x,l.y); ctx.restore(); }
  function drawBrush(l){ ctx.save(); ctx.translate(l.x,l.y); ctx.rotate((l.angle||0)*Math.PI/180); ctx.fillStyle=l.color;
    if(l.taper){ const n=60,h=l.thick,w=l.len,top=[],bot=[]; for(let i=0;i<n;i++){ const t=i/(n-1),x=-w/2+t*w,half=(h/2)*Math.pow(Math.sin(Math.PI*t),0.6); top.push([x,-half]); bot.push([x,half]); } ctx.beginPath(); ctx.moveTo(top[0][0],top[0][1]); top.forEach(p=>ctx.lineTo(p[0],p[1])); for(let i=bot.length-1;i>=0;i--)ctx.lineTo(bot[i][0],bot[i][1]); ctx.closePath(); ctx.fill(); }
    else{ roundRect(-l.len/2,-l.thick/2,l.len,l.thick,l.thick/2); ctx.fill(); } ctx.restore(); }
  function shapePath(k,w,h){ const hw=w/2,hh=h/2;
    if(k==='rect'){ roundRect(-hw,-hh,w,h,Math.min(w,h)*0.08); }
    else if(k==='ellipse'||k==='ring'){ ctx.beginPath(); ctx.ellipse(0,0,hw,hh,0,0,Math.PI*2); }
    else if(k==='tri'){ ctx.beginPath(); ctx.moveTo(0,-hh); ctx.lineTo(hw,hh); ctx.lineTo(-hw,hh); ctx.closePath(); }
    else if(k==='arrow'){ ctx.beginPath(); ctx.moveTo(-hw,-hh*0.4); ctx.lineTo(hw*0.3,-hh*0.4); ctx.lineTo(hw*0.3,-hh); ctx.lineTo(hw,0); ctx.lineTo(hw*0.3,hh); ctx.lineTo(hw*0.3,hh*0.4); ctx.lineTo(-hw,hh*0.4); ctx.closePath(); }
    else if(k==='star'){ ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?Math.min(hw,hh)*0.45:Math.min(hw,hh); const a=-Math.PI/2+i*Math.PI/5; ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); }
  }
  function drawShape(l){ ctx.save(); ctx.translate(l.x,l.y); ctx.rotate((l.angle||0)*Math.PI/180); ctx.globalAlpha=l.opacity; shapePath(l.kind,l.w,l.h);
    if(l.kind==='ring'){ ctx.lineWidth=l.stroke||14; ctx.strokeStyle=l.color; ctx.stroke(); }
    else{ if(l.filled){ ctx.fillStyle=l.color; ctx.fill(); } if(l.stroke>0){ ctx.lineWidth=l.stroke; ctx.strokeStyle=l.strokeColor||'#000'; ctx.stroke(); } }
    ctx.restore(); }
  function sealDims(l){ const tw=measure(l.text,l.size,IMPACT,0),px=l.size*0.42,py=l.size*0.22; return {tw,px,py,bw:tw+px*2,bh:l.size*1.02+py*2}; }
  function drawSeal(l){ const d=sealDims(l); ctx.save(); roundRect(l.x,l.y,d.bw,d.bh,Math.min(12,l.size*0.2)); ctx.fillStyle=l.bgColor||'#000'; ctx.fill(); ctx.lineWidth=Math.max(3,l.size*0.09); ctx.strokeStyle=l.brd||'#fff'; ctx.stroke(); ctx.font=`800 ${l.size}px ${IMPACT}`; ctx.textBaseline='top'; ctx.textAlign='left'; ctx.fillStyle=l.color||'#fff'; ctx.fillText(l.text,l.x+d.px,l.y+d.py); ctx.restore(); }
  function drawOne(l){ l.type==='text'?drawText(l):l.type==='brush'?drawBrush(l):l.type==='shape'?drawShape(l):l.type==='seal'?drawSeal(l):null; }

  function centered(l){ return l.type==='brush'||l.type==='shape'; }
  function localBox(l){ if(l.type==='brush')return{x:-l.len/2,y:-l.thick,w:l.len,h:l.thick*2}; if(l.type==='shape')return{x:-l.w/2,y:-l.h/2,w:l.w,h:l.h}; if(l.type==='seal'){const d=sealDims(l);return{x:l.x,y:l.y,w:d.bw,h:d.bh};} const w=l._w||measure(l.text,l.size,l.font,l.spacing); return {x:anchorX(l,w),y:l.y,w,h:l.size*1.12}; }
  function bboxAA(l){ const b=localBox(l); return {x:b.x-6,y:b.y-6,w:b.w+12,h:b.h+12}; }
  function drawGuides(){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1.5; ctx.setLineDash([]); [1/3,2/3].forEach(f=>{ ctx.beginPath(); ctx.moveTo(W*f,0); ctx.lineTo(W*f,H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,H*f); ctx.lineTo(W,H*f); ctx.stroke(); }); ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.setLineDash([6,6]); ctx.strokeRect(W*0.045,H*0.06,W*0.91,H*0.88); const z=zoneBox(); ctx.setLineDash([10,7]); ctx.strokeStyle='rgba(56,189,248,.5)'; ctx.lineWidth=2; ctx.strokeRect(z.x,24,z.w,H-48); ctx.restore(); }
  function drawSel(){ if(sel<0)return; const l=layers[sel]; ctx.save(); ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2; ctx.setLineDash([8,6]);
    if(centered(l)){ ctx.translate(l.x,l.y); ctx.rotate((l.angle||0)*Math.PI/180); const b=localBox(l); ctx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12); }
    else{ const b=bboxAA(l); ctx.strokeRect(b.x,b.y,b.w,b.h); } ctx.restore(); }
  function render(){ ctx.clearRect(0,0,W,H); drawBg(); if(scrim)drawScrim(); layers.forEach(drawOne); if(!exporting&&guides)drawGuides(); if(!exporting)drawSel(); buildLayers(); }

  function toCanvas(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)}; }
  function hit(px,py){ for(let i=layers.length-1;i>=0;i--){ const l=layers[i];
    if(centered(l)){ const dx=px-l.x,dy=py-l.y,a=-(l.angle||0)*Math.PI/180,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a),b=localBox(l); if(lx>=b.x-8&&lx<=b.x+b.w+8&&ly>=b.y-8&&ly<=b.y+b.h+8)return i; }
    else{ const b=bboxAA(l); if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return i; } } return -1; }
  cv.addEventListener('pointerdown',e=>{ const p=toCanvas(e),i=hit(p.x,p.y); sel=i; if(i>=0){ drag={i,ox:p.x-layers[i].x,oy:p.y-layers[i].y}; cv.setPointerCapture(e.pointerId); } render(); showInsp(); });
  cv.addEventListener('pointermove',e=>{ if(!drag){ const p=toCanvas(e); cv.style.cursor=hit(p.x,p.y)>=0?'grab':'default'; return; } const p=toCanvas(e),l=layers[drag.i]; l.x=p.x-drag.ox; l.y=p.y-drag.oy; render(); });
  const endDrag=()=>drag=null; cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);

  function add(l){ layers.push(l); sel=layers.length-1; render(); showInsp(); }
  const tdef=o=>Object.assign({type:'text',x:zoneC(),y:H*0.42,size:120,font:IMPACT,color:'#FFD700',color2:'#ff5c00',grad:false,outline:14,outlineColor:'#000000',shadow:false,shadowColor:'#000000',neon:false,highlight:false,highlightColor:'#CC0000',upper:false,spacing:0,align:'center'},o);
  document.getElementById('b-text').onclick=()=>add(tdef({text:'SEU TEXTO'}));
  document.getElementById('b-emoji').onclick=()=>add(tdef({text:'🔥',size:170,outline:0,color:'#ffffff',y:H*0.32}));
  document.getElementById('b-brush').onclick=()=>add({type:'brush',x:zoneC(),y:H*0.62,len:Math.min(460,ZW),thick:20,angle:-3,color:gold?'#B08D3E':'#CC0000',taper:true});
  document.getElementById('b-shape').onclick=()=>add({type:'shape',kind:'ring',x:W*0.28,y:H*0.5,w:320,h:320,angle:0,color:'#FF2E63',filled:false,stroke:16,strokeColor:'#000000',opacity:1});
  document.getElementById('b-seal').onclick=()=>add({type:'seal',x:W-210,y:H-104,text:'55 ANOS',size:42,bgColor:'#000000',brd:'#ffffff',color:'#ffffff'});
  document.getElementById('b-del').onclick=()=>{ if(sel>=0){layers.splice(sel,1);sel=-1;render();showInsp();} };

  document.getElementById('b-preset').onclick=()=>{ const z=zoneBox(),zc=z.x+z.w/2; const yC=gold?'#E8B23A':'#FFD700',rC=gold?'#D4AF37':'#CC0000',bC=gold?'#B08D3E':'#CC0000';
    const s1=fit('CONTEXTO',IMPACT,z.w,140,46),s2=fit('IMPACTO',IMPACT,z.w,178,58),s3=fit('RESULTADO',IMPACT,z.w,168,52); const gap=16,bh=28,total=s1+gap+s2+gap+bh+gap+s3; let y=(H-total)/2;
    const mk=(t,size,color)=>tdef({text:t,size,color,outline:Math.round(size*0.12),align:'center',x:zc,y:y});
    const a=[]; a.push(mk('CONTEXTO',s1,'#FFFFFF')); y+=s1+gap; a.push(mk('IMPACTO',s2,yC)); y+=s2+gap;
    a.push({type:'brush',x:zc,y:y+bh/2,len:Math.min(measure('IMPACTO',s2,IMPACT,0)*1.05,z.w),thick:20,angle:-3,color:bC,taper:true}); y+=bh+gap;
    a.push(mk('RESULTADO',s3,rC)); a.push({type:'seal',x:W-210,y:H-104,text:'55 ANOS',size:42,bgColor:'#000',brd:'#fff',color:'#fff'});
    layers=a; sel=1; render(); showInsp(); };

  document.querySelectorAll('#pos button').forEach(b=>b.onclick=()=>{ textZone=b.dataset.z; document.querySelectorAll('#pos button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
  const tg=(id,fn)=>{ const b=document.getElementById(id); b.onclick=()=>{ fn(); b.classList.toggle('on'); render(); }; };
  tg('b-scrim',()=>scrim=!scrim); tg('b-guides',()=>guides=!guides); tg('b-gold',()=>gold=!gold);
  const file=document.getElementById('file'); document.getElementById('b-img').onclick=()=>file.click();
  file.onchange=()=>{ const f=file.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{bg=im;sel=-1;render();showInsp();}; im.src=rd.result; }; rd.readAsDataURL(f); };
  document.getElementById('b-dl').onclick=()=>{ const s=sel; sel=-1; exporting=true; render(); cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='miniatura-darkblue.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); exporting=false; sel=s; render(); },'image/png'); };
  window.addEventListener('keydown',e=>{ if(sel<0)return; const t=e.target.tagName; if(t==='TEXTAREA'||t==='INPUT'||t==='SELECT')return; const l=layers[sel],st=e.shiftKey?20:3;
    if(e.key==='Delete'||e.key==='Backspace'){layers.splice(sel,1);sel=-1;render();showInsp();e.preventDefault();return;}
    if(e.key==='ArrowLeft')l.x-=st; else if(e.key==='ArrowRight')l.x+=st; else if(e.key==='ArrowUp')l.y-=st; else if(e.key==='ArrowDown')l.y+=st; else return; e.preventDefault(); render(); });

  const body=document.getElementById('insp-body'), head=document.getElementById('insp-head');
  function field(label,el,val){ const f=document.createElement('div'); f.className='field'; if(label){const l=document.createElement('label');const s=document.createElement('span');s.textContent=label;l.appendChild(s); if(val!==undefined){const v=document.createElement('span');v.textContent=val;v.style.color='var(--muted)';l.appendChild(v);} f.appendChild(l);} f.appendChild(el); return f; }
  function range(min,max,val,step,cb){ const r=document.createElement('input'); r.type='range'; r.min=min;r.max=max;r.value=val;r.step=step||1; r.oninput=()=>{cb(+r.value);render();}; return r; }
  function toggle(label,on,cb){ const b=document.createElement('button'); b.className='btn tgl'+(on?' on':''); b.textContent=label; b.style.width='100%'; b.onclick=()=>{cb();showInsp();render();}; return b; }
  function swatches(cur,cb){ const w=document.createElement('div'); w.className='swatches'; PALETTE.forEach(c=>{ const b=document.createElement('button'); b.className='sw'+(String(c).toLowerCase()===String(cur).toLowerCase()?' active':''); b.style.background=c; b.title=c; b.onclick=()=>{cb(c);showInsp();render();}; w.appendChild(b); }); const cu=document.createElement('input'); cu.type='color'; cu.className='sw'; cu.value=/^#([0-9a-f]{6})$/i.test(cur)?cur:'#ffffff'; cu.title='Cor personalizada'; cu.oninput=()=>{cb(cu.value);render();}; w.appendChild(cu); return w; }
  function seg(opts,cur,cb){ const s=document.createElement('div'); s.className='seg'; opts.forEach(([t,v])=>{ const b=document.createElement('button'); b.textContent=t; b.className=cur===v?'on':''; b.onclick=()=>{cb(v);showInsp();render();}; s.appendChild(b); }); return s; }

  function imgPanel(){
    head.textContent='Imagem & Fundo'; body.innerHTML='';
    if(!bg){ body.innerHTML='<p class="empty">Clique em <b>📁 Imagem</b> pra enviar sua foto de fundo — ou monte só com texto/formas. Depois clique num elemento pra editar todas as opções.</p>'; return; }
    const chips=document.createElement('div'); chips.className='chips';
    const presets={'Normal':{b:1,c:1,s:1,se:0,g:0,bl:0,vig:false},'Vívido':{b:1,c:1.12,s:1.6,se:0,g:0,bl:0,vig:false},'P&B':{b:1,c:1.05,s:1,se:0,g:1,bl:0,vig:false},'Vintage':{b:1.05,c:.95,s:.85,se:.55,g:0,bl:0,vig:false},'Cinema':{b:.95,c:1.22,s:1.05,se:0,g:0,bl:0,vig:true},'Suave':{b:1,c:1,s:1,se:0,g:0,bl:2,vig:false}};
    Object.keys(presets).forEach(k=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=k; c.onclick=()=>{Object.assign(img,presets[k]);showInsp();render();}; chips.appendChild(c); });
    body.appendChild(field('Filtros rápidos',chips));
    body.appendChild(field('Brilho',range(.4,1.8,img.b,.02,v=>img.b=v),img.b.toFixed(2)));
    body.appendChild(field('Contraste',range(.4,2,img.c,.02,v=>img.c=v),img.c.toFixed(2)));
    body.appendChild(field('Saturação',range(0,2.5,img.s,.02,v=>img.s=v),img.s.toFixed(2)));
    body.appendChild(field('Sépia',range(0,1,img.se,.02,v=>img.se=v),img.se.toFixed(2)));
    body.appendChild(field('Desfoque',range(0,12,img.bl,.5,v=>img.bl=v),img.bl+'px'));
    body.appendChild(field('',toggle('🌑 Vinheta (bordas escuras)',img.vig,()=>img.vig=!img.vig)));
  }

  function zControls(){ const z=document.createElement('div'); z.className='zrow'; const mkb=(t,fn)=>{const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;return b;};
    z.appendChild(mkb('⬇ Trás',()=>{if(sel>0){[layers[sel],layers[sel-1]]=[layers[sel-1],layers[sel]];sel--;render();showInsp();}}));
    z.appendChild(mkb('⬆ Frente',()=>{if(sel<layers.length-1){[layers[sel],layers[sel+1]]=[layers[sel+1],layers[sel]];sel++;render();showInsp();}}));
    z.appendChild(mkb('⧉ Duplicar',()=>{const c=JSON.parse(JSON.stringify(layers[sel]));c.x+=24;c.y+=24;layers.push(c);sel=layers.length-1;render();showInsp();}));
    body.appendChild(document.createElement('hr')); body.appendChild(z); }

  function showInsp(){ if(sel<0){ imgPanel(); buildLayers(); return; } const l=layers[sel]; body.innerHTML='';
    if(l.type==='text'){ head.textContent=(l.text||'').length<=2?'Emoji / Sticker':'Texto';
      const ta=document.createElement('textarea'); ta.rows=2; ta.value=l.text; ta.oninput=()=>{l.text=ta.value;render();}; body.appendChild(field('Conteúdo',ta));
      if((l.text||'').length<=2){ const em=document.createElement('div'); em.className='chips'; EMOJIS.forEach(e=>{const c=document.createElement('button');c.className='chip';c.style.fontSize='16px';c.textContent=e;c.onclick=()=>{l.text=e;render();showInsp();};em.appendChild(c);}); body.appendChild(field('Escolher emoji',em)); }
      const fs=document.createElement('select'); FONTS.forEach(([n,v])=>{const o=document.createElement('option');o.value=v;o.textContent=n;if(v===l.font)o.selected=true;fs.appendChild(o);}); fs.onchange=()=>{l.font=fs.value;render();}; body.appendChild(field('Fonte',fs));
      body.appendChild(field('Tamanho',range(24,360,l.size,1,v=>l.size=v),l.size));
      if(l.size<60&&(l.text||'').length>2){const d=document.createElement('div');d.className='warn';d.textContent='⚠ Texto pequeno perde clique no celular — deixe GRANDE.';body.appendChild(field('',d));}
      body.appendChild(field('Alinhamento',seg([['⬅','left'],['⬍','center'],['➡','right']],l.align,v=>l.align=v)));
      body.appendChild(field('Espaço entre letras',range(-8,40,l.spacing,1,v=>l.spacing=v),l.spacing));
      body.appendChild(field('Cor',swatches(l.color,c=>l.color=c)));
      body.appendChild(field('',toggle('🌈 Degradê (2 cores)',l.grad,()=>l.grad=!l.grad)));
      if(l.grad)body.appendChild(field('Cor 2 (degradê)',swatches(l.color2,c=>l.color2=c)));
      body.appendChild(field('Contorno preto',range(0,34,l.outline,1,v=>l.outline=v),l.outline));
      body.appendChild(field('',toggle('MAIÚSCULAS',l.upper,()=>l.upper=!l.upper)));
      body.appendChild(field('',toggle('◾ Sombra',l.shadow,()=>l.shadow=!l.shadow)));
      body.appendChild(field('',toggle('✨ Neon (brilho)',l.neon,()=>l.neon=!l.neon)));
      body.appendChild(field('',toggle('🖍 Realce (fundo atrás)',l.highlight,()=>l.highlight=!l.highlight)));
      if(l.highlight)body.appendChild(field('Cor do realce',swatches(l.highlightColor,c=>l.highlightColor=c)));
    }
    else if(l.type==='brush'){ head.textContent='Linha / Marcador';
      body.appendChild(field('Cor',swatches(l.color,c=>l.color=c)));
      body.appendChild(field('Comprimento',range(60,ZW,l.len,1,v=>l.len=v),Math.round(l.len)));
      body.appendChild(field('Espessura',range(6,70,l.thick,1,v=>l.thick=v),l.thick));
      body.appendChild(field('Inclinação',range(-45,45,l.angle,1,v=>l.angle=v),l.angle+'°'));
      body.appendChild(field('',toggle('Pontas afiladas',l.taper,()=>l.taper=!l.taper)));
    }
    else if(l.type==='shape'){ head.textContent='Forma';
      body.appendChild(field('Tipo',seg(SHAPES.map(([n,v])=>[n.split(' ')[0],v]),l.kind,v=>{l.kind=v;})));
      body.appendChild(field('Cor',swatches(l.color,c=>l.color=c)));
      if(l.kind!=='ring'){ body.appendChild(field('',toggle('Preenchido',l.filled,()=>l.filled=!l.filled))); body.appendChild(field('Borda',range(0,40,l.stroke,1,v=>l.stroke=v),l.stroke)); if(l.stroke>0)body.appendChild(field('Cor da borda',swatches(l.strokeColor,c=>l.strokeColor=c))); }
      else body.appendChild(field('Espessura do anel',range(4,50,l.stroke,1,v=>l.stroke=v),l.stroke));
      const r=document.createElement('div'); r.className='row'; r.appendChild(field('Largura',range(40,1240,l.w,1,v=>l.w=v))); r.appendChild(field('Altura',range(40,700,l.h,1,v=>l.h=v))); body.appendChild(r);
      body.appendChild(field('Girar',range(-180,180,l.angle,1,v=>l.angle=v),l.angle+'°'));
      body.appendChild(field('Opacidade',range(.1,1,l.opacity,.05,v=>l.opacity=v),l.opacity.toFixed(2)));
    }
    else if(l.type==='seal'){ head.textContent='Selo';
      const ta=document.createElement('input'); ta.type='text'; ta.value=l.text; ta.oninput=()=>{l.text=ta.value;render();}; body.appendChild(field('Texto',ta));
      body.appendChild(field('Tamanho',range(24,100,l.size,1,v=>l.size=v),l.size));
      body.appendChild(field('Cor do texto',swatches(l.color,c=>l.color=c)));
      body.appendChild(field('Cor do fundo',swatches(l.bgColor,c=>l.bgColor=c)));
      body.appendChild(field('Cor da borda',swatches(l.brd,c=>l.brd=c)));
    }
    zControls(); buildLayers();
  }
  function buildLayers(){ const box=document.getElementById('layers'); if(!box)return; box.innerHTML='';
    for(let i=layers.length-1;i>=0;i--){ const l=layers[i]; const ic=l.type==='text'?((l.text||'').length<=2?'😀':'🅣'):l.type==='brush'?'🟥':l.type==='shape'?'◆':'🔖'; const lbl=l.type==='text'?(l.text||'texto'):l.type==='brush'?'Linha':l.type==='shape'?'Forma':('Selo '+l.text);
      const el=document.createElement('div'); el.className='layer'+(i===sel?' sel':''); el.innerHTML='<span>'+ic+'</span><span class="lbl"></span>'; el.querySelector('.lbl').textContent=lbl; el.onclick=()=>{sel=i;render();showInsp();}; box.appendChild(el); } }

  showInsp(); render();
})();
</script>

</body>
</html>
